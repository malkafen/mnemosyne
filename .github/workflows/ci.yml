name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR/branch cancels the previous, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: google-java-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Fails if any file under src/ differs from google-java-format output.
      # Fix locally with: mvn spotless:apply
      - name: Check formatting
        run: mvn -B --no-transfer-progress spotless:check

  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B --no-transfer-progress clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mnemosyne-jar
          path: target/mnemosyne-*.jar
          if-no-files-found: error
