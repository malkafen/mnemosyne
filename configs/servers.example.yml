---
# Mnemosyne inventory — example
# =============================
# Copy this file to configs/servers.yml and edit it for your environment:
#   cp configs/servers.example.yml configs/servers.yml
#
# The inventory is a LIST of "mnemons" (hypervisor groups). Each group is one
# libvirt host plus the VMs that should exist on it. On every run Mnemosyne makes
# the host match this file: VMs listed here but missing are created, VMs present
# on the host but missing here are destroyed.
#
# Inside a group, `servers` is a MAP. The map KEY is the server id — a stable
# identity stored in the VM's libvirt metadata. Matching of managed VMs is done
# by this id, so you can rename a VM (change `name`) without recreating it.
# `name` is the libvirt domain name / disk volume name / hostname; if omitted it
# defaults to the key. Keep the key stable; change `name` freely.
#
# All values below are FAKE and only illustrate the format.

# ----- Group 1: a hypervisor host and its VMs --------------------------------
- group: "hv01.example.lan"          # human-readable label (shown in logs/plan)
  host: "192.0.2.10"                 # hypervisor address for the SSH/libvirt link
  user: "virtops"                    # SSH user on the hypervisor
  port: 22                           # SSH port (1-65535)
  key: "/home/virtops/.ssh/id_ed25519"  # PRIVATE SSH key, absolute path ("~" is NOT expanded)

  # Group defaults: `volLookup`, `metaUrl` and the `templates` block are declared
  # once here and inherited by every server below, which may still override them.
  volLookup: "debian-13-genericcloud-amd64.qcow2"   # base image in `pool` to clone new disks from
  # Base URL where the VMs reach Mnemosyne's cloud-init server. Must be reachable
  # from INSIDE the guest — the Mnemosyne host IP, port 8080, path /cloud-init/.
  metaUrl: "http://192.0.2.5:8080/cloud-init/"

  servers:

    # --- VM #1: a small web node ---
    # `name` omitted → libvirt domain name / hostname defaults to the key below.
    web-01.example.lan:              # server id (stable) AND, here, the domain name
      cpu: 2                         # vCPU count (1-128)
      ram: 2048                      # RAM in MiB (256-1048576)
      ip: "192.0.2.40/24"            # primary address in CIDR notation
      gateway: "192.0.2.1"           # default gateway (plain IPv4)
      disk: 30                       # disk size in GiB (minimum 10); base image is resized to this.
                                     # Raising it later grows the disk on the next run; lowering it
                                     # is refused and stops the run.
      pool: "default"                # libvirt storage pool holding the base image and new disk
      network: "host-bridge"         # libvirt network / bridge to attach the VM to
      launch: true                   # the VM must be running; every run brings it to this state.
                                     # A new VM boots once regardless, so cloud-init can configure
                                     # it, and is shut down again at the end of that run.
      autostart: true                # optional: libvirt autostart when the hypervisor boots.
                                     # Omit the key to leave the domain's own setting alone.
      # volLookup / metaUrl / templates are inherited from the group above.

      # --- Additional disks (optional) ---------------------------------------
      # Blank qcow2 volumes attached after the root disk, in the order listed here.
      # They arrive in the guest RAW: partitioning, filesystems and /etc/fstab are the
      # administrator's job. Mnemosyne creates them and never writes to them again.
      #
      # `name`  1-20 characters of a-z, 0-9 and '-', unique within the VM. It becomes the
      #         volume file name (`web-01.example.lan-data.qcow2`) AND the disk's serial,
      #         so the guest gets /dev/disk/by-id/virtio-data. PARTITION THAT PATH, not
      #         /dev/vdb: the letters follow the order of this list and would shift if a
      #         disk were ever inserted above.
      # `size`  GiB, at least 1. No base image has to fit in it, so there is no 10 GiB floor.
      #         Raise it later and the disk is grown on the next run; lower it and the run stops.
      # `pool`  optional; defaults to the VM's own `pool` above.
      #
      # Disks are never removed or shrunk. A new entry here is created and attached on the
      # next run — to a VM that already exists too, hot-plugged if the guest allows it and
      # applied on the next boot otherwise. Removing an entry does NOT delete anything: the
      # disk stays attached and is reported as "not in the inventory". Raising `size` GROWS
      # the disk (the guest's partition and filesystem are still yours to extend); lowering
      # it is refused and stops the whole run. Deleting the VM itself DOES delete these
      # volumes, along with the root disk; the plan names every one of them first.
      extraDisks:
        - name: data                 # -> /dev/disk/by-id/virtio-data in the guest
          size: 40                   # GiB
        - name: logs
          size: 50
          pool: "fast-ssd"           # this disk lives in another pool than the VM's root

    # --- VM #2: a cache node (relies on field defaults where possible) ---
    # `name` set explicitly → the key stays the stable id, the domain can be
    # renamed later by editing `name` without recreating the VM.
    cache-01:                        # server id (stable)
      name: "cache-01.example.lan"   # libvirt domain name / hostname
      cpu: 4
      ram: 4096
      ip: "192.0.2.41/24"
      gateway: "192.0.2.1"
      disk: 40
      pool: "default"
      network: "host-bridge"
      # Per-server overrides of the group defaults:
      volLookup: "noble-server-cloudimg-amd64.img"

# ----- Group 2: a second hypervisor ------------------------------------------
- group: "hv02.example.lan"
  host: "192.0.2.20"
  user: "virtops"
  port: 22
  key: "/home/virtops/.ssh/id_ed25519"
  servers:

    db-01.example.lan:
      cpu: 8
      ram: 16384
      ip: "198.51.100.50/24"
      gateway: "198.51.100.1"
      disk: 120
      pool: "fast-ssd"
      volLookup: "debian-13-genericcloud-amd64.qcow2"
      network: "host-bridge"
      metaUrl: "http://192.0.2.5:8080/cloud-init/"
      # Override the default templates only if you keep them somewhere custom.
      # These are the defaults; a `templates:` block is also valid at group level.
      # templates:
      #   serverTmpl: "/app/templates/server.xml"
      #   volTmpl: "/app/templates/volume.xml"
      #   metaDataTmpl: "/app/templates/meta-data.yml"
      #   userDataTmpl: "/app/templates/user-data.yml"
      #   networkConfigTmpl: "/app/templates/network-config.yml"
